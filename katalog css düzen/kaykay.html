<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAYKAY — Özten Spor Kataloğu</title>
<link rel="stylesheet" href="Ozten Spor Katalog.css">
<script src="sepet.js" defer></script>
</head>
<body id="top">
<div class="floating-nav-group">
    <a href="#top" class="floating-nav-btn"><span class="fn-arrow">&#8593;</span> Yukarı Çık</a>
</div>
<div class="kategori-gecis-buton-sarici">
    <a href="paten#top" class="floating-nav-btn"><span class="fn-arrow">&#8592;</span> Paten'e Dön</a>
</div>
<div class="katalog-arama"><input type="text" placeholder="Ürün ara..." oninput="aramaFiltrele(this)"></div>

<p class="urun-bulunamadi" hidden>Ürün bulunamadı.</p>
<section class="page cat-page" id="kategori-kaykay">
        <div class="cat-header">
            <div class="cat-num">18</div>
            <div class="cat-titleblock">
                <h1>KAYKAY</h1>
                <p>Kaykay çeşitleri.</p>
            </div>
        </div>
        <div class="product-grid"><div class="product-card">
        <div class="img-placeholder" style="height:34mm;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#B9B9B9" stroke-width="1.4">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <circle cx="8" cy="10" r="2"/>
            <path d="M22 16l-6-6-8 8"/>
        </svg>
        <span>GÖRSEL ALANI</span>
    </div>
        <div class="pf pf-filled"><span class="pf-label filled">Ürün Adı</span></div>
        <div class="pf pf-filled"><span class="pf-label filled">Açıklama</span></div>
        <div class="pf pf-price"><span class="pf-label">Fiyat</span><span class="pf-line short"></span></div>
    </div>
<div class="product-card">
        <div class="img-placeholder" style="height:34mm;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#B9B9B9" stroke-width="1.4">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <circle cx="8" cy="10" r="2"/>
            <path d="M22 16l-6-6-8 8"/>
        </svg>
        <span>GÖRSEL ALANI</span>
    </div>
        <div class="pf pf-filled"><span class="pf-label filled">Ürün Adı</span></div>
        <div class="pf pf-filled"><span class="pf-label filled">Açıklama</span></div>
        <div class="pf pf-price"><span class="pf-label">Fiyat</span><span class="pf-line short"></span></div>
    </div>
</div>
        <div class="footer">
        <span>ÖZTEN SPOR — Spor Malzemeleri Kataloğu</span>
        <span>Kaykay</span>
        <span>1</span>
    </div>
    </section>


<script>
function aramaFiltrele(inp){
  var q=inp.value.toLocaleLowerCase('tr-TR').trim(), gorunen=0;
  document.querySelectorAll('.product-card').forEach(function(k){
    var e=k.querySelector('.pf-label');
    var esles=(e?e.textContent.toLocaleLowerCase('tr-TR'):'').indexOf(q)!==-1;
    k.style.display=esles?'':'none';
    if(esles)gorunen++;
  });
  document.querySelector('.urun-bulunamadi').hidden=!(q&&gorunen===0);
}
</script>
</body>
</html>
